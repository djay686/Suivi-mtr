<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Procédure — MTR Performance</title>
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
/* v167 — Procédure de travail interactive, dans le style de la procédure BT-089, aux couleurs MTR Performance
   (charbon du logo + or de l'app). Rail des étapes à gauche (pastilles sur téléphone), une étape à la fois,
   Précédent / Suivant collés en bas. Les coches se partagent entre tablettes (Supabase, temps réel). */
:root{
  --bg:#EDEFF1; --surface:#FFFFFF; --surface-2:#F5F6F7; --ink:#15171A; --muted:#5A6068; --line:#D4D8DD;
  --accent:#E0A81E; --accent-ink:#7A5A08; --accent-soft:#FBF0D2;
  --head:#1B1E23; --head-ink:#F4F1E8; --head-muted:#A7ACB3;
  --ok:#1E7A4B; --ok-soft:#DDF1E6; --warn:#A8520A; --warn-soft:#FBEBD9; --danger:#B42318; --danger-soft:#FBE3E0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px; --shade:rgba(10,11,12,.94); color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101214; --surface:#191C20; --surface-2:#20242A; --ink:#ECEDEF; --muted:#9BA1A9; --line:#2F343B;
  --accent:#F5B02A; --accent-ink:#F5C45A; --accent-soft:#3A2F12; --head:#0E1013; --head-ink:#F4F1E8; --head-muted:#9BA1A9;
  --ok:#52C68D; --ok-soft:#173826; --warn:#F2A646; --warn-soft:#3B2A14; --danger:#F27264; --danger-soft:#3F1C18; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- en-tête ---------- */
.top{position:sticky;top:0;z-index:20;color:var(--head-ink);border-bottom:3px solid var(--accent);padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(135deg,rgba(224,168,30,.16) 0,rgba(224,168,30,.16) 9%,transparent 9.3%),linear-gradient(135deg,transparent 0,transparent 11%,rgba(224,168,30,.09) 11.3%,rgba(224,168,30,.09) 13%,transparent 13.3%),var(--head)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:grid;gap:8px}
.idrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:42px;width:42px;border-radius:8px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.bt{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;color:var(--accent);line-height:1}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who strong{font-weight:600;font-size:15px}
.who span{font-size:13px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--head-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--head-muted);display:inline-block}
.sync.live i{background:#52C68D}.sync.local i{background:#F2A646}
.fermer{border:1.5px solid #4A5058;background:#20242A;color:#F2F2F0;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
/* v169 : TV du poste */
.tvzone{position:relative}
.tvbtn{border:1.5px solid #4A5058;background:#20242A;color:#F2F2F0;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.tvbtn.lie{background:var(--accent);border-color:var(--accent);color:#15171A}
.tvmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:220px}
.tvmenu button{border:0;background:var(--surface-2);border-radius:8px;padding:9px 12px;text-align:left;font-weight:600}
.tvmenu button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.prog{display:flex;align-items:center;gap:10px}
.prog .bar{flex:1;height:8px;background:#2A2E33;border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.prog span{font-family:var(--display);font-size:15px;font-weight:600;min-width:74px;text-align:right}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;color:var(--head-muted);padding:10px 12px 9px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:3px solid transparent;margin-bottom:-3px}
.tabs button[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--accent)}

/* ---------- page ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 24px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:160px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 180px);overflow:auto;padding-right:4px}
.rail button{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px}
.rail button:hover{background:var(--surface)}
.rail button[aria-current="step"]{background:var(--surface);border-color:var(--line)}
.rail .n{font-family:var(--display);font-weight:700;font-size:18px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--muted)}
.rail .t{font-size:14px;font-weight:500;line-height:1.2;min-width:0}
.rail .c{font-size:12px;color:var(--muted)}
.rail .part .n{border-color:var(--accent);color:var(--accent-ink)}
.rail .done .n{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.rail .n svg{width:16px;height:16px}
.step{display:flex;flex-direction:column;gap:16px;min-width:0}
.sh{display:grid;gap:6px}
.eyebrow{font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.sh h1{font-size:34px;line-height:1.05;font-weight:700}
.why{margin:0;color:var(--muted);max-width:65ch}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.spec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.spec small{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spec b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.spec em{font-style:normal;font-size:13px;color:var(--muted)}
.alerts{display:grid;gap:8px}
.alert{border-radius:var(--r);padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:15px}
.alert .tag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-top:1px}
.alert.danger{background:var(--danger-soft)}.alert.danger .tag{background:var(--danger);color:var(--surface)}
.alert.warn{background:var(--warn-soft)}.alert.warn .tag{background:var(--warn);color:var(--surface)}
.alert.note{background:var(--surface);border:1px solid var(--line)}.alert.note .tag{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.alert.ok{background:var(--ok-soft)}.alert.ok .tag{background:var(--ok);color:var(--surface)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.block h2{font-size:18px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:12px 16px 4px}
.checks{list-style:none;margin:0;padding:0}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.rowwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left;background:none;border:0}
.row .box{width:30px;height:30px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--surface);transition:background .15s,border-color .15s}
.row .box svg{width:18px;height:18px;opacity:0}
.row .txt{font-size:16px;min-width:0}
.row .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok)}
.row[aria-checked="true"] .box svg{opacity:1}
.row[aria-checked="true"] .txt{color:var(--muted)}
.row:hover{background:var(--surface-2)}
.srow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 16px}
.stxt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sides{display:flex;gap:6px;flex-wrap:wrap}
.side{min-width:58px;height:40px;padding:0 10px;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:6px}
.side svg{width:15px;height:15px;display:none}
.side[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.side[aria-pressed="true"] svg{display:block}
.srow.alldone .txt{color:var(--muted)}
b.v{font-family:var(--display);font-weight:700;font-size:1.12em;color:var(--ink);background:var(--accent-soft);padding:0 5px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:12px 16px 16px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--muted)}
.inp{display:flex;align-items:center;border:2px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden}
.inp:focus-within{border-color:var(--accent)}
.inp input{border:0;background:none;padding:10px 12px;width:100%;min-width:0;font-size:17px;font-variant-numeric:tabular-nums}
.inp input:focus{outline:none}
.inp span{padding:0 12px;color:var(--muted);font-size:14px;font-weight:600}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:2px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:500}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.verdict{font-size:13.5px;font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.warn{color:var(--warn)}.verdict.bad{color:var(--danger)}
.notes{padding:0 16px 16px}
textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:8px;background:var(--surface-2);padding:10px 12px;font-size:16px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.stepnav{display:flex;gap:10px;justify-content:space-between;align-items:center;position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#15171A}
.btn:disabled{opacity:.4;cursor:default}
.stepnav .mid{font-size:14px;color:var(--muted);text-align:center}

/* ---------- specs et résumé ---------- */
.page{display:flex;flex-direction:column;gap:16px;max-width:900px}
.page h1{font-size:34px;font-weight:700}
.page p{margin:0;color:var(--muted);max-width:65ch}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;font-size:15px}
thead th{border-top:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr.grp td{background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
td.val{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.search{display:flex;gap:8px}
.search input{flex:1;border:2px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;font-size:16px;min-width:0}
.liens{display:grid;gap:6px}
.liens a,.liens button{color:var(--ink);text-decoration:none;display:flex;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:left;font-size:15px;overflow-wrap:anywhere}
.liens a span,.liens button span{color:var(--muted);font-size:13px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.sum textarea{min-height:300px;font-size:14.5px;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{font-size:14px;color:var(--ok);font-weight:600}
.pending{display:grid;gap:6px}
.pending a{color:var(--ink);text-decoration:none;display:flex;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.pending a span{color:var(--muted);font-variant-numeric:tabular-nums}
.danger-zone{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:8px}
.btn.del{color:var(--danger);border-color:var(--danger);background:var(--surface)}
.btn.del.armed{background:var(--danger);color:var(--surface)}
.bandeau{border-radius:var(--r);padding:10px 14px;font-size:14px;background:var(--warn-soft)}
.etat{max-width:620px;margin:12vh auto;padding:24px;text-align:center;display:grid;gap:12px;justify-items:center}
.etat h1{font-size:30px}.etat p{margin:0;color:var(--muted)}

/* ---------- pages du manuel ---------- */
.ref{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--muted)}
.ref b{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.figbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;margin-right:12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.srow .figbtn{margin-right:0}
.figbtn svg{width:16px;height:16px;flex:none}
.figbtn:hover{border-color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px 16px 16px}
.thumb{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:0;min-width:0}
.thumb .ph{width:100%;aspect-ratio:3/4;background:#FFFFFF;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:#5A6068;font-family:var(--display);font-size:22px;font-weight:700}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .ph.photo{aspect-ratio:4/3;font-size:13px;font-weight:500}
.thumb span{font-size:13px;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb:hover .ph{border-color:var(--accent)}
.lb{position:fixed;inset:0;z-index:50;background:var(--shade);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-bar,.lb-nav{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;color:#F2F2F0}
.lb-bar span{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.04em}
.lb-bar div{display:flex;gap:8px}
.lb button{border:1.5px solid #4A5058;background:#20242A;color:#F2F2F0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:15px}
.lb button:disabled{opacity:.35}
.lb-img{overflow:auto;display:grid;place-items:center;padding:0 16px;-webkit-overflow-scrolling:touch}
.lb-img canvas,.lb-img img{max-width:100%;max-height:100%;background:#FFFFFF;border-radius:6px}
.lb.zoom .lb-img{place-items:start}
.lb.zoom .lb-img canvas,.lb.zoom .lb-img img{max-width:none;max-height:none}
.lb-msg{color:#F2F2F0;max-width:520px;text-align:center;font-size:16px;line-height:1.5}
.lb-cap{padding:10px 16px 0;color:#F2F2F0;display:grid;gap:4px;max-width:900px;margin:0 auto;width:100%}
.lb-cap p{margin:0;font-size:16px}
.lb-cap small{color:#A7ACB3;font-size:13px}

@media (max-width:860px){
  .top{position:static}
  .layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .rail{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding:2px 0 6px;gap:6px;scrollbar-width:thin}
  .rail button{grid-template-columns:auto;padding:4px;border-radius:50%}
  .rail .t,.rail .c{display:none}
  .rail .n{width:40px;height:40px;font-size:19px}
  .rail button[aria-current="step"]{background:none;border-color:transparent}
  .rail button[aria-current="step"] .n{box-shadow:0 0 0 3px var(--accent)}
  .sh h1,.page h1{font-size:28px}
  .bt{font-size:26px}
  .tabs button{font-size:16px;padding:9px 10px 8px}
}
@media (max-width:520px){ .sync{flex-basis:100%;order:3} .who{min-width:150px} .logo{height:36px;width:36px} }
@media (max-width:420px){ .who span{white-space:normal} .row{padding:12px} .fields{grid-template-columns:minmax(0,1fr)} .btn{padding:12px 14px;font-size:16px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="idrow">
      <img class="logo" src="icon-192.png" alt="MTR Performance">
      <span class="bt" id="btNum">—</span>
      <div class="who"><strong id="whoClient">Procédure de travail</strong><span id="whoMachine"></span></div>
      <span class="sync" id="sync"><i></i><span>Connexion…</span></span>
      <span class="tvzone"><button type="button" class="tvbtn" id="tvbtn" aria-pressed="false" title="Afficher l'étape en cours sur la TV du poste" hidden>📺 TV</button><span class="tvmenu" id="tvmenu" hidden></span></span>
      <button type="button" class="fermer" id="fermer" hidden>✕ Fermer</button>
    </div>
    <div class="prog"><div class="bar"><i id="barFill"></i></div><span id="progTxt" class="num">0 / 0</span></div>
    <nav class="tabs" role="tablist" aria-label="Vues">
      <button role="tab" id="tab-etapes" data-view="etapes" aria-selected="true">Étapes</button>
      <button role="tab" id="tab-specs" data-view="specs" aria-selected="false">Specs</button>
      <button role="tab" id="tab-resume" data-view="resume" aria-selected="false">Résumé</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <div id="bandeau" class="bandeau" hidden></div>
  <div id="view-etapes" class="layout">
    <aside class="rail" id="rail" aria-label="Étapes"></aside>
    <section id="stepview" class="step" aria-live="polite"></section>
  </div>
  <div id="view-specs" class="page" hidden></div>
  <div id="view-resume" class="page" hidden></div>
</main>
<div id="etat" class="etat" hidden></div>

<div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="Page du manuel">
  <div class="lb-bar"><span id="lbCount" class="num"></span><div><button type="button" id="lbZoom">Agrandir</button><button type="button" id="lbClose">Fermer</button></div></div>
  <div class="lb-img" id="lbWrap"></div>
  <div class="lb-cap"><p id="lbCap"></p><small id="lbRef"></small></div>

/* ---------- résumé ---------- */
function summaryText() {
  var F = state.fields, L = [], b = P.contenu.bt || {};

  L.push("Procédure : " + (P.contenu.titre || ""));
  var c = allCounts(); L.push("Progression : " + c.done + " / " + c.tot + " points faits");
  var dec = STEPS[0] ? STEPS[0].fields.filter(function (f) { return F[f.id]; }) : [];
  if (dec.length) { L.push(""); L.push("DÉCISIONS DU CLIENT"); dec.forEach(function (f) { L.push("- " + f.label + " : " + F[f.id]); }); }
  var meas = [];
  STEPS.forEach(function (s, i) {
    if (i === 0) return;
    s.fields.forEach(function (f) {
      var v = F[f.id]; if (v == null || v === "") return;
      var r = verdictFor(f, v);
      meas.push("- " + f.label + " : " + v + (f.unite ? " " + f.unite : "") + (r && r[0] !== "ok" && r[1] ? " (" + r[1] + ")" : ""));
    });
  });
  if (meas.length) { L.push(""); L.push("MESURES ET OBSERVATIONS"); L = L.concat(meas); }
  var notes = [];
  STEPS.forEach(function (s, i) { var n = F[s.id + "-notes"]; if (n) notes.push("- " + (i ? "Étape " + i + " (" + s.short + ")" : "Préparation") + " : " + n); });
  if (notes.length) { L.push(""); L.push("NOTES"); L = L.concat(notes); }
  var todo = [];
  STEPS.forEach(function (s, i) { var k = stepCounts(s); if (k.done < k.tot) todo.push("- " + (i ? "Étape " + i : "Préparation") + " " + s.short + " : " + (k.tot - k.done) + " point(s) restant(s)"); });
  L.push(""); L.push(todo.length ? "À TERMINER" : "TOUTES LES ÉTAPES SONT FAITES");

}

    (versBT ? '<button type="button" class="btn primary" id="versBT">Ajouter aux notes du BT</button>' : '') +

    (pend.length ? '<div class="pending">' + pend.map(function (x) { return '<a href="#e' + x.i + '" data-go="' + x.i + '"><strong>' + (x.i ? "Étape " + x.i + " · " : "") + esc(x.s.short) + '</strong><span>' + x.left + ' restant' + (x.left > 1 ? 's' : '') + '</span></a>'; }).join("") + '</div>'
      : '<div class="alert ok"><span class="tag">OK</span><span>Toutes les étapes sont cochées.</span></div>') +
    '<div class="danger-zone"><p>Effacer toutes les coches et les mesures de cette procédure, sur toutes les tablettes.</p><div class="actions"><button type="button" class="btn del" id="wipe">Tout effacer</button></div></div>';
}

  ["etapes", "specs", "resume"].forEach(function (n) {

  });

  if (v === "specs") renderSpecs();
  if (v === "resume") renderSummary();
  refreshCounts();
  var h = v === "etapes" ? "e" + cur : v;
  if (push !== false && location.hash.slice(1) !== h) { try { history.replaceState(null, "", location.pathname + location.search + "#" + h); } catch (e) {} }

/* ================= TV DU POSTE (v169) =================

var tvEcrans = [], tvMinuterie = null, tvCanal = null;

  tvMaj();
  return Promise.resolve(sb.from("ecrans").update(champs).eq("id", id)).then(function (r) { if (r && r.error) flashTv("Pas envoyé à la TV : " + r.error.message); return r; });
